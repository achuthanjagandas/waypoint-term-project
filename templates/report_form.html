{% extends "base.html" %}

{% block title %}
Submit a Trail Report | Waypoint
{% endblock %}

{% block content %}
<div class="container page-content">
    <section class="form-panel">
        <p class="eyebrow">Community information</p>

        <h2>Submit a trail report</h2>

        <p>
            Share current trail conditions to help other visitors
            plan safely.
        </p>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button class="button" type="submit">
                Submit report
            </button>
        </form>
    </section>
</div>
{% endblock %}
